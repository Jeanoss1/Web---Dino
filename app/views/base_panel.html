<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>{% block titulo %}Dino Park{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",

    extend: {

        "on-secondary-container": "#612400", "secondary-fixed-dim": "#ffb693", "on-error-container": "#93000a",

<script src="{{ url_for('static', filename='js/csrf.js') }}" defer></script>
{% block head %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dino.css') }}">
</head>
<body class="bg-surface font-body-md text-on-surface">

{% include '_menu.html' %}

<div class="lg:pl-72 layout-main">
<main class="relative bg-surface min-h-screen px-space-md lg:px-space-lg py-space-lg">
{% include '_flash.html' %}
{% block contenido %}{% endblock %}
</main>
</div>

{% block scripts %}{% endblock %}

</html>
